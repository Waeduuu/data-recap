<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RK Garage - Data Jual & Beli</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    padding: 30px 15px;
    color: white;
    background:
        radial-gradient(circle at top, #3b0764, #14051f 45%, #07070c);
}

.container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
}

.header {
    text-align: center;
    margin-bottom: 30px;
}

.header h1 {
    font-size: 42px;
    color: #f5d0fe;
    margin-bottom: 8px;
}

.header p {
    color: #d8b4fe;
}

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.tab-btn {
    flex: 1;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #24132f;
    color: white;
    cursor: pointer;
    font-weight: bold;
    font-size: 15px;
}

.tab-btn.active {
    background: linear-gradient(135deg, #9333ea, #c084fc);
}

.panel {
    display: none;
}

.panel.active {
    display: block;
}

.box {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 20px;
    backdrop-filter: blur(10px);
}

.box h2 {
    color: #f5d0fe;
    margin-bottom: 15px;
}

.form {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
}

input,
select {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #1b1328;
    color: white;
    outline: none;
}

select option {
    background: #1b1328;
}

button {
    border: none;
    border-radius: 10px;
    padding: 13px 18px;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.add-btn {
    background: linear-gradient(135deg, #9333ea, #c084fc);
}

.discord-btn {
    background: #5865f2;
}

.reset-btn {
    background: #dc2626;
}

.item-list {
    margin-top: 20px;
}

.item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 14px;
    margin-bottom: 8px;
    border-radius: 10px;
    background: rgba(255,255,255,.05);
}

.item-info {
    flex: 1;
}

.item-name {
    font-weight: bold;
}

.item-price {
    color: #d8b4fe;
    font-size: 13px;
    margin-top: 3px;
}

.delete-btn {
    background: #dc2626;
    padding: 8px 12px;
    font-size: 12px;
}

.total-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-top: 20px;
}

.total {
    font-size: 32px;
    font-weight: bold;
    color: #f5d0fe;
}

.actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.empty {
    text-align: center;
    color: #999;
    padding: 20px;
}

.status {
    margin-top: 15px;
    padding: 10px;
    border-radius: 8px;
    display: none;
}

.status.success {
    display: block;
    background: rgba(34,197,94,.15);
    color: #86efac;
}

.status.error {
    display: block;
    background: rgba(220,38,38,.15);
    color: #fca5a5;
}

@media(max-width:600px) {
    .header h1 {
        font-size: 32px;
    }

    .tabs {
        flex-direction: column;
    }

    .total-box {
        flex-direction: column;
        align-items: stretch;
    }

    .actions {
        flex-direction: column;
    }

    .actions button {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>RK GARAGE</h1>
        <p>Data Penjualan & Pembelian Alat</p>
    </div>

    <!-- TAB -->
    <div class="tabs">
        <button
            class="tab-btn active"
            onclick="showTab('jual', this)">
            DATA JUAL
        </button>

        <button
            class="tab-btn"
            onclick="showTab('beli', this)">
            DATA BELI ALAT
        </button>
    </div>


    <!-- ========================= -->
    <!-- DATA JUAL -->
    <!-- ========================= -->

    <div id="jual" class="panel active">

        <div class="box">

            <h2>Data Penjualan</h2>

            <div class="form">

                <input
                    type="text"
                    id="jualCustomer"
                    placeholder="Nama Warga">

                <input
                    type="text"
                    id="jualSeller"
                    placeholder="Nama Penjual / Mekanik">

                <input
                    type="text"
                    id="jualPlate"
                    placeholder="Plat Kendaraan">

                <select id="jualItem"></select>

                <input
                    type="number"
                    id="jualQty"
                    value="1"
                    min="1"
                    placeholder="Jumlah">

            </div>

            <br>

            <button
                class="add-btn"
                onclick="addJual()">
                + Tambah Barang
            </button>

        </div>


        <div class="box">

            <h2>Senarai Penjualan</h2>

            <div
                id="jualList"
                class="item-list">
            </div>

            <div class="total-box">

                <div>
                    <div>Total Penjualan</div>

                    <div
                        class="total"
                        id="jualTotal">
                        $0
                    </div>
                </div>

                <div class="actions">

                    <button
                        class="discord-btn"
                        onclick="sendJualDiscord()">
                        💬 Send Discord
                    </button>

                    <button
                        class="reset-btn"
                        onclick="resetJual()">
                        Reset
                    </button>

                </div>

            </div>

            <div
                id="jualStatus"
                class="status">
            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- DATA BELI -->
    <!-- ========================= -->

    <div id="beli" class="panel">

        <div class="box">

            <h2>Data Pembelian Alat</h2>

            <div class="form">

                <input
                    type="text"
                    id="beliSupplier"
                    placeholder="Nama Supplier">

                <input
                    type="text"
                    id="beliWorker"
                    placeholder="Nama Pembeli">

                <select id="beliItem"></select>

                <input
                    type="number"
                    id="beliQty"
                    value="1"
                    min="1"
                    placeholder="Jumlah">

            </div>

            <br>

            <button
                class="add-btn"
                onclick="addBeli()">
                + Tambah Alat
            </button>

        </div>


        <div class="box">

            <h2>Senarai Pembelian</h2>

            <div
                id="beliList"
                class="item-list">
            </div>

            <div class="total-box">

                <div>

                    <div>Total Pembelian</div>

                    <div
                        class="total"
                        id="beliTotal">
                        $0
                    </div>

                </div>

                <div class="actions">

                    <button
                        class="discord-btn"
                        onclick="sendBeliDiscord()">
                        💬 Send Discord
                    </button>

                    <button
                        class="reset-btn"
                        onclick="resetBeli()">
                        Reset
                    </button>

                </div>

            </div>

            <div
                id="beliStatus"
                class="status">
            </div>

        </div>

    </div>

</div>


<script>

/* =====================================================
   WEBHOOK
===================================================== */

const WEBHOOK_JUAL =
"https://canary.discord.com/api/webhooks/1537765528624566272/Yx7H-knrSrnzNW8BHLjQi18XoNzuDvjZAXPGhDC6YOCkCstVSx_Af1M8Vrg68QDyxp2z";


const WEBHOOK_BELI =
"https://canary.discord.com/api/webhooks/1537768039527747665/nZFB9lHkuQcg_pNwa19KfFcxo5Nh7rMASIj7mGoQptbj8XLIAMo1fS0I0-tqDQ2zhjsm";


/* =====================================================
   DATA HARGA
===================================================== */

/*
   MASUKKAN HARGA ASAL KAU DI SINI.

   FORMAT:

   ["NAMA BARANG", HARGA]

*/

const items = [

    /*
    CONTOH:

    ["ENGINE", 150000],
    ["BRAKES", 100000],
    ["TURBO", 110000],

    GANTIKAN / TAMBAH DENGAN
    SENARAI HARGA KAU.
    */

];


/* =====================================================
   VARIABLES
===================================================== */

let jualData = [];

let beliData = [];


/* =====================================================
   FORMAT MONEY
===================================================== */

function money(value) {

    return Number(value).toLocaleString("en-US");

}


/* =====================================================
   TAB
===================================================== */

function showTab(tab, button) {

    document
        .querySelectorAll(".panel")
        .forEach(panel => {

            panel.classList.remove("active");

        });


    document
        .querySelectorAll(".tab-btn")
        .forEach(btn => {

            btn.classList.remove("active");

        });


    document
        .getElementById(tab)
        .classList.add("active");


    button.classList.add("active");

}


/* =====================================================
   LOAD ITEMS
===================================================== */

function loadItems() {

    const jualSelect =
        document.getElementById("jualItem");


    const beliSelect =
        document.getElementById("beliItem");


    jualSelect.innerHTML =
        '<option value="">-- Pilih Barang --</option>';


    beliSelect.innerHTML =
        '<option value="">-- Pilih Alat --</option>';


    items.forEach((item, index) => {

        const optionJual =
            document.createElement("option");

        optionJual.value = index;

        optionJual.textContent =
            `${item[0]} - $${money(item[1])}`;

        jualSelect.appendChild(optionJual);


        const optionBeli =
            document.createElement("option");

        optionBeli.value = index;

        optionBeli.textContent =
            `${item[0]} - $${money(item[1])}`;

        beliSelect.appendChild(optionBeli);

    });

}


/* =====================================================
   ADD JUAL
===================================================== */

function addJual() {

    const select =
        document.getElementById("jualItem");

    const qty =
        Number(
            document.getElementById("jualQty").value
        );


    if (
        select.value === "" ||
        qty <= 0
    ) {

        alert("Pilih barang dan jumlah dahulu.");

        return;

    }


    const item =
        items[Number(select.value)];


    jualData.push({

        name: item[0],

        price: Number(item[1]),

        qty: qty,

        total:
            Number(item[1]) * qty

    });


    renderJual();

}


/* =====================================================
   ADD BELI
===================================================== */

function addBeli() {

    const select =
        document.getElementById("beliItem");

    const qty =
        Number(
            document.getElementById("beliQty").value
        );


    if (
        select.value === "" ||
        qty <= 0
    ) {

        alert("Pilih alat dan jumlah dahulu.");

        return;

    }


    const item =
        items[Number(select.value)];


    beliData.push({

        name: item[0],

        price: Number(item[1]),

        qty: qty,

        total:
            Number(item[1]) * qty

    });


    renderBeli();

}


/* =====================================================
   RENDER JUAL
===================================================== */

function renderJual() {

    const list =
        document.getElementById("jualList");


    if (jualData.length === 0) {

        list.innerHTML =
            '<div class="empty">Belum ada data penjualan.</div>';

        document.getElementById("jualTotal")
            .innerText = "$0";

        return;

    }


    let html = "";

    let total = 0;


    jualData.forEach((item, index) => {

        total += item.total;


        html += `

            <div class="item">

                <div class="item-info">

                    <div class="item-name">
                        ${item.name}
                    </div>

                    <div class="item-price">
                        $${money(item.price)}
                        × ${item.qty}
                        =
                        $${money(item.total)}
                    </div>

                </div>

                <button
                    class="delete-btn"
                    onclick="removeJual(${index})">
                    Hapus
                </button>

            </div>

        `;

    });


    list.innerHTML = html;


    document.getElementById("jualTotal")
        .innerText =
        "$" + money(total);

}


/* =====================================================
   RENDER BELI
===================================================== */

function renderBeli() {

    const list =
        document.getElementById("beliList");


    if (beliData.length === 0) {

        list.innerHTML =
            '<div class="empty">Belum ada data pembelian.</div>';

        document.getElementById("beliTotal")
            .innerText = "$0";

        return;

    }


    let html = "";

    let total = 0;


    beliData.forEach((item, index) => {

        total += item.total;


        html += `

            <div class="item">

                <div class="item-info">

                    <div class="item-name">
                        ${item.name}
                    </div>

                    <div class="item-price">
                        $${money(item.price)}
                        × ${item.qty}
                        =
                        $${money(item.total)}
                    </div>

                </div>

                <button
                    class="delete-btn"
                    onclick="removeBeli(${index})">
                    Hapus
                </button>

            </div>

        `;

    });


    list.innerHTML = html;


    document.getElementById("beliTotal")
        .innerText =
        "$" + money(total);

}


/* =====================================================
   REMOVE
===================================================== */

function removeJual(index) {

    jualData.splice(index, 1);

    renderJual();

}


function removeBeli(index) {

    beliData.splice(index, 1);

    renderBeli();

}


/* =====================================================
   SEND JUAL DISCORD
===================================================== */

async function sendJualDiscord() {

    if (jualData.length === 0) {

        alert("Belum ada data penjualan.");

        return;

    }


    const customer =
        document.getElementById(
            "jualCustomer"
        ).value || "-";


    const seller =
        document.getElementById(
            "jualSeller"
        ).value || "-";


    const plate =
        document.getElementById(
            "jualPlate"
        ).value || "-";


    let total = 0;

    let detail = "";


    jualData.forEach(item => {

        total += item.total;


        detail +=
            `• ${item.name} × ${item.qty} = $${money(item.total)}\n`;

    });


    const payload = {

        username: "RK Garage - Data Jual",

        embeds: [{

            title: "🛒 DATA PENJUALAN",

            color: 10181046,

            fields: [

                {
                    name: "👤 Nama Warga",
                    value: customer,
                    inline: true
                },

                {
                    name: "👨‍🔧 Penjual",
                    value: seller,
                    inline: true
                },

                {
                    name: "🚗 Plat",
                    value: plate,
                    inline: true
                },

                {
                    name: "📦 Barang",
                    value:
                        "```" +
                        detail +
                        "```",
                    inline: false
                },

                {
                    name: "💰 TOTAL",
                    value:
                        "$" + money(total),
                    inline: false
                }

            ],

            timestamp:
                new Date().toISOString()

        }]

    };


    await sendWebhook(
        WEBHOOK_JUAL,
        payload,
        "jualStatus"
    );

}


/* =====================================================
   SEND BELI DISCORD
===================================================== */

async function sendBeliDiscord() {

    if (beliData.length === 0) {

        alert("Belum ada data pembelian.");

        return;

    }


    const supplier =
        document.getElementById(
            "beliSupplier"
        ).value || "-";


    const worker =
        document.getElementById(
            "beliWorker"
        ).value || "-";


    let total = 0;

    let detail = "";


    beliData.forEach(item => {

        total += item.total;


        detail +=
            `• ${item.name} × ${item.qty} = $${money(item.total)}\n`;

    });


    const payload = {

        username:
            "RK Garage - Data Beli",

        embeds: [{

            title:
                "🔧 DATA PEMBELIAN ALAT",

            color:
                10181046,

            fields: [

                {
                    name:
                        "🏪 Supplier",

                    value:
                        supplier,

                    inline: true
                },

                {
                    name:
                        "👨‍🔧 Pembeli",

                    value:
                        worker,

                    inline: true
                },

                {
                    name:
                        "📦 Alat Dibeli",

                    value:
                        "```" +
                        detail +
                        "```",

                    inline: false
                },

                {
                    name:
                        "💰 TOTAL PEMBELIAN",

                    value:
                        "$" +
                        money(total),

                    inline: false
                }

            ],

            timestamp:
                new Date().toISOString()

        }]

    };


    await sendWebhook(
        WEBHOOK_BELI,
        payload,
        "beliStatus"
    );

}


/* =====================================================
   WEBHOOK FUNCTION
===================================================== */

async function sendWebhook(
    webhook,
    payload,
    statusId
) {

    const status =
        document.getElementById(statusId);


    try {

        const response =
            await fetch(
                webhook,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(payload)

                }
            );


        if (response.ok) {

            status.className =
                "status success";

            status.innerText =
                "✅ Berjaya dihantar ke Discord.";

        } else {

            const error =
                await response.text();

            console.error(error);


            status.className =
                "status error";

            status.innerText =
                "❌ Gagal menghantar ke Discord.";

        }

    } catch (error) {

        console.error(error);


        status.className =
            "status error";

        status.innerText =
            "❌ Error: " +
            error.message;

    }

}


/* =====================================================
   RESET
===================================================== */

function resetJual() {

    jualData = [];

    document.getElementById(
        "jualCustomer"
    ).value = "";

    document.getElementById(
        "jualSeller"
    ).value = "";

    document.getElementById(
        "jualPlate"
    ).value = "";

    document.getElementById(
        "jualQty"
    ).value = 1;

    renderJual();

}


function resetBeli() {

    beliData = [];

    document.getElementById(
        "beliSupplier"
    ).value = "";

    document.getElementById(
        "beliWorker"
    ).value = "";

    document.getElementById(
        "beliQty"
    ).value = 1;

    renderBeli();

}


/* =====================================================
   START
===================================================== */

loadItems();

renderJual();

renderBeli();

</script>

</body>
</html>
